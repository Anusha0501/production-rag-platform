services:
  - type: web
    name: rag-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rag-postgres
          property: connectionString
      - key: CHROMA_HOST
        value: rag-chroma
      - key: JWT_SECRET
        generateValue: true
  - type: web
    name: rag-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
  - type: pserv
    name: rag-chroma
    runtime: docker
    image:
      url: chromadb/chroma:0.5.23
databases:
  - name: rag-postgres
    databaseName: rag
    user: rag
