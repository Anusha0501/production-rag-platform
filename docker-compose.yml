services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  chroma:
    image: chromadb/chroma:0.5.23
    ports: ["8001:8000"]
    volumes: ["chroma_data:/chroma/chroma"]
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/rag
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      JWT_SECRET: dev-secret-change-me
      LANGSMITH_TRACING: "false"
    depends_on: [postgres, chroma]
    ports: ["8000:8000"]
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on: [backend]
    ports: ["3000:80"]
volumes:
  postgres_data:
  chroma_data:
